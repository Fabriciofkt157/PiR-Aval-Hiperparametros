<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avaliação cega · πR</title>
<style>
:root{--bg:#e8edf0;--card:#fff;--ink:#16222b;--soft:#5b6b76;--line:#cfd8de;--acc:#1f4fd8;--ok:#1a7f5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center}
header b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button,header select{background:#26363f;color:#fff;border:1px solid #3b4d58;border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;max-width:46vw}
#bar{height:4px;background:#2c3d47}#bar i{display:block;height:100%;background:#4ade9b;width:0}
main{max-width:640px;margin:0 auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
.prompt{font:600 20px/1.3 Georgia,'Iowan Old Style',serif;margin:2px 0 12px}
.c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid transparent;scroll-margin-top:64px}
.c.cur{border-color:var(--acc)}
.lab .chk{display:none;color:var(--ok);font-weight:700}.c.done .lab .chk{display:inline}
.lab{color:var(--soft);font-size:13px;margin-bottom:6px}
.dup{color:var(--soft);font-size:13px;margin:0 0 12px}
.lay{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px}
.lay .prompt{grid-area:p}.lay .ref{grid-area:r}.lay .rest{grid-area:c;min-width:0}
.lay{grid-template-areas:"p" "r" "c"}
.ref{background:#eef6f1;border:1px solid #b9dcc9;border-left:4px solid var(--ok);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:15px}
.ref h3{margin:0 0 4px;font:600 12px system-ui;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.ref p{margin:0;white-space:pre-wrap}
@media(min-width:980px){
  main{max-width:1040px}
  .lay.hasref{grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"p r" "c r"}
  .lay.hasref .ref{position:sticky;top:70px;align-self:start;margin:0}
}
.tx{white-space:pre-wrap;font-size:17px;margin-bottom:16px}
.row{margin-bottom:12px}.row small{display:flex;justify-content:space-between;color:var(--soft);font-size:13px;margin-bottom:4px}
.row div{display:flex;gap:6px}
.row button{flex:1;height:52px;border:1px solid var(--line);background:#f4f7f8;border-radius:10px;font:600 18px system-ui;color:var(--ink);padding:0}
.row button:active{background:#dbe4ff}.row button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tot{text-align:right;font:700 20px Georgia,serif}.tot span{font:13px system-ui;color:var(--soft)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center}
footer button{border:0;border-radius:10px;height:48px;font:600 16px system-ui;background:#e8edf0;color:var(--ink);padding:0 16px}
footer #save{flex:1;max-width:340px;background:var(--acc);color:#fff}footer #save:disabled{background:#b5c0c7}
#msg{color:var(--soft);font-size:13px;text-align:center;min-width:64px}
#err{max-width:520px;margin:80px auto;text-align:center;padding:0 16px}
</style></head><body>
<header><b id="who">Avaliação cega · πR</b><select id="jump"></select><button id="dl" title="Baixar meu JSON">⤓ JSON</button></header>
<div id="bar"><i></i></div><main id="app"></main>
<footer id="ft" hidden><button id="prev">‹</button><span id="msg"></span><button id="next">›</button><button id="save" disabled>Salvar e próxima</button></footer>
<script>
const K=new URLSearchParams(location.search).get('k')||localStorage.getItem('k');
const CAT=['Precisão factual','Persona','Português'],LOW=['errado','','','','','perfeito'];
let S,order,done,pos,q,sc,cur=0,busy=false;
const $=s=>document.querySelector(s);
const api=(a,x='',body)=>fetch(`/api/${a}?k=${encodeURIComponent(K)}${x}`,body&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j});
const fail=m=>{$('#app').innerHTML=`<div id="err"><h2>Não foi possível entrar</h2><p>${m}</p><p>Use o link pessoal enviado a você (com <code>?k=…</code>).</p></div>`;$('#ft').hidden=true};
const full=r=>r.every(v=>v!==null);

async function init(){
  if(!K)return fail('Código de acesso ausente.');
  try{S=await api('session')}catch(e){return fail(e.message)}
  localStorage.setItem('k',K);history.replaceState(0,'','?k='+K);
  order=S.order;done=new Set(S.done);$('#who').textContent='Olá, '+S.id;$('#ft').hidden=false;
  $('#jump').innerHTML=order.map((_,i)=>`<option value="${i}"></option>`).join('');
  const f=order.findIndex(i=>!done.has(i));go(f<0?0:f);
}
function prog(){
  $('#bar i').style.width=100*done.size/order.length+'%';
  [...$('#jump').options].forEach((o,i)=>o.textContent=`Pergunta ${i+1}/${order.length}${done.has(order[i])?' ✓':''}`);$('#jump').value=pos;
}
async function go(p){
  if(busy||p<0||p>=order.length)return;pos=p;prog();$('#app').innerHTML='<p>Carregando…</p>';
  try{q=await api('question','&idx='+order[p])}catch(e){return fail(e.message)}
  sc=q.saved||q.texts.map(()=>[null,null,null]);
  const f=sc.findIndex(r=>!full(r));cur=f<0?0:f;render();window.scrollTo(0,0);
  if(p+1<order.length)api('question','&idx='+order[p+1]).catch(()=>0);
}
function render(){
  const N=q.texts.length;
  $('#app').innerHTML='<div class="lay'+(q.ref?' hasref':'')+'"><div class="prompt"></div>'+(q.ref?'<aside class="ref"><h3>Referência factual</h3><p></p></aside>':'')+'<div class="rest"><div class="dup" hidden></div><div id="cards"></div></div></div>';
  $('.prompt').textContent=q.prompt;
  if(q.ref)$('.ref p').textContent=q.ref;
  if(N<q.total){const d=$('.dup');d.hidden=false;d.textContent=`Respostas idênticas foram unidas: ${q.total} respostas viraram ${N} distintas. Cada nota vale para todas as cópias.`}
  const rows=CAT.map((n,k)=>`<div class="row"><small><span>${n}</span><span>0 = errado · 5 = perfeito</span></small><div>${[0,1,2,3,4,5].map(v=>`<button data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('');
  $('#cards').innerHTML=q.texts.map((_,i)=>`<section class="c" data-i="${i}"><div class="lab">Resposta ${i+1} de ${N} <span class="chk">✓</span></div><div class="tx"></div>${rows}<div class="tot"></div></section>`).join('');
  document.querySelectorAll('#cards .tx').forEach((el,i)=>el.textContent=q.texts[i]);
  paint();
}
function paint(){
  document.querySelectorAll('#cards .c').forEach((c,i)=>{
    const r=sc[i];c.classList.toggle('cur',i===cur);c.classList.toggle('done',full(r));
    c.querySelectorAll('.row').forEach((row,k)=>row.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===r[k])));
    c.querySelector('.tot').innerHTML=full(r)?`${r[0]+r[1]+r[2]}<span> / 15</span>`:'';
  });
  const n=sc.filter(full).length,all=n===sc.length;
  $('#msg').textContent=`${n}/${sc.length}`;$('#save').disabled=!all||busy;
  $('#save').textContent=all?(pos===order.length-1?'Salvar ✓':'Salvar e próxima'):`Faltam ${sc.length-n} respostas`;
}
function focusCard(i){cur=i;paint();document.querySelectorAll('#cards .c')[i].scrollIntoView({behavior:'smooth',block:'start'})}
function put(i,k,v){
  const was=full(sc[i]);sc[i][k]=v;cur=i;paint();
  if(!was&&full(sc[i])){ // ao completar as 3 notas, rola para a próxima resposta sem nota
    const nx=sc.findIndex((r,j)=>j>i&&!full(r)),any=sc.findIndex(r=>!full(r)),t=nx>=0?nx:any;
    if(t>=0)setTimeout(()=>focusCard(t),220);
  }
}
$('#app').addEventListener('click',e=>{
  const c=e.target.closest('.c');if(!c)return;const i=+c.dataset.i,b=e.target.closest('button');
  if(b&&b.dataset.v!==undefined)put(i,+b.dataset.k,+b.dataset.v);else if(i!==cur){cur=i;paint()}
});
addEventListener('keydown',e=>{
  if(!q||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey)return;
  if(/^[0-5]$/.test(e.key)){const k=sc[cur].indexOf(null);put(cur,k<0?2:k,+e.key)}
  else if(e.key==='ArrowDown'&&cur<sc.length-1){e.preventDefault();focusCard(cur+1)}
  else if(e.key==='ArrowUp'&&cur>0){e.preventDefault();focusCard(cur-1)}
  else if(e.key==='Enter'&&!$('#save').disabled)save();
});
async function save(){
  busy=true;paint();$('#msg').textContent='…';
  try{await api('rate','',{idx:q.idx,scores:sc});done.add(q.idx);busy=false;
    if(pos+1<order.length)go(pos+1);else{prog();paint();$('#msg').textContent='✓'}}
  catch(e){busy=false;paint();alert('Não salvou: '+e.message+'\nSuas notas continuam na tela — toque em salvar de novo.')}
}
const dirty=()=>sc&&sc.some(r=>r.some(v=>v!==null))&&!done.has(q.idx);
const nav=p=>{if(dirty()&&!confirm('Você tem notas desta pergunta que ainda não foram salvas. Sair mesmo assim?'))return;go(p)};
$('#save').onclick=save;$('#prev').onclick=()=>nav(pos-1);$('#next').onclick=()=>nav(pos+1);
$('#jump').onchange=e=>{e.target.blur();const p=+e.target.value;if(p===pos)return;if(dirty()&&!confirm('Você tem notas desta pergunta que ainda não foram salvas. Sair mesmo assim?')){$('#jump').value=pos;return}go(p)};
$('#dl').onclick=()=>location.href=`/api/mine?k=${encodeURIComponent(K)}`;
init();
</script></body></html>
